spring.application.name=phishmenot
server.port=${PORT:8080}

# Base URL of the React frontend (post-login redirects + CORS)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Optional comma-separated Google emails that get the ADMIN role when they sign in (new or existing account).
# Roles can also be changed directly in the database (SRS FR-046).
app.admin-emails=${ADMIN_EMAILS:}

# ---- MySQL 8 (credentials come from environment variables, NFR-007) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/phishmenot?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Google OAuth 2.0 / OpenID Connect (FR-020) ----
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:missing-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:missing-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---- Session cookie ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-stacktrace=never
server.error.include-message=never
